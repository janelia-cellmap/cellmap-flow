[project]
name = "cellmap-flow"
description = "Realtime prediction using neuroglancer"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dynamic = ["version"]
license = { text = "BSD 3-Clause License" }
authors = [
    { email = "ackermand@hhmi.org", name = "David Ackerman" },
    { email = "zouinkhim@hhmi.org", name = "Marwan Zouinkhi"},
]

dependencies = [
    "pymorton",
    "numpy",
    "PyYAML",
    "fastremap",
    "fastmorph",
    "flask",
    "flask-cors",
    "tensorstore",
    "funlib.geometry",
    "scikit-image",
    "numcodecs==0.15.0",
    "zarr==2.18.4",
    "s3fs",
    "torch",    
    "universal_pathlib",
    "mwatershed",
    "neuroglancer",
    "pydantic",
    "funlib.persistence==0.6.1",
    "daisy",
    "cellmap-models",
    # Below 2: tokenizers requires it, and with hub 2 allowed the resolver
    # kept hub 2 and fell back to transformers 4.12 (which bounds neither),
    # whose tokenizers 0.10 has no wheels and does not build: the finetune
    # extra (peft -> transformers) could not be installed.
    "huggingface_hub<2",
    # Imported directly but previously only arriving transitively.
    "requests",
    "scipy",
    "click",
    # Serves the predictions (serving/chunkmirage_server.py), unless
    # CELLMAP_FLOW_ENGINE=flask: its main since PR #17 merged (channel
    # ops, chunkmirage.serve, the cache size given, queued chunks in the
    # order they were asked for). Not on PyPI yet: a release of cellmap-flow
    # needs one, as PyPI refuses a dependency given by URL.
    "chunkmirage @ git+https://github.com/yuriyzubov/chunkmirage@7331a3fcd0b32a281b74c79766f6d52450a8f2a8",
    ]

# extras
# https://peps.python.org/pep-0621/#dependencies-optional-dependencies
[project.optional-dependencies]
dacapo = ["dacapo-ml"]
cellpose = ["cellpose==3.1.1.1"]
bioimageio = ["bioimageio.core[onnx,pytorch]==0.11.0", "timm>=1.0"]
test = ["pytest", "pytest-cov"]
dev = [
    "black",
    "mypy",
    "pdbpp",
    "rich",
    "ruff",
    "pre-commit",
]
docs = [
    "sphinx-autodoc-typehints",
    "sphinx-autoapi",
    "sphinx-click",
    "sphinx-rtd-theme",
    "myst-parser",
]

# mwatershed is a core dependency; edt is only needed by the
# distance-transform normalizers.
postprocess = ["edt"]

finetune = [
    "peft>=0.7.0",           # HuggingFace Parameter-Efficient Fine-Tuning (pulls transformers, accelerate)
    "tensorboard",           # Training curves; lora_trainer silently skips logging without it
    # MinIO server and client are required for annotations but not available on PyPI.
    # Install via conda-forge: mamba install minio-server minio-client -c conda-forge
    # Neuroglancer with voxel annotation support is required but not yet on PyPI.
    # Install via: pip install git+https://github.com/briossant/neuroglancer@feature/voxel-annotation
]

# AI-assisted annotation in the finetune tab (docs/ai_annotate.md): the
# Vertex AI Gemini client. Imported only when a model is called, so the
# dashboard runs without it; the feature then says how to install it.
ai-annotate = ["google-genai>=1.0"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Without an include list, namespace discovery also installs tests/, example/,
# docs/ and models/ as top-level packages in site-packages.
include = ["cellmap_flow*"]

[tool.setuptools.dynamic]
version = { attr = "cellmap_flow.__version__" }

[tool.setuptools.package-data]
"cellmap_flow.dashboard" = ["templates/*.html", "templates/_*.html", "static/css/*.css", "static/js/**/*.js", "static/img/*"]
"cellmap_flow.models" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# napari's auto-loaded pytest plugin crashes collection in some envs; blocking
# it is harmless where napari isn't installed.
addopts = "-ra -p no:napari"
markers = [
    "finetune: needs peft (skipped when it can't be imported)",
    "gpu: needs a CUDA device (skipped without one)",
    "lsf: submits real LSF jobs (skipped without bsub)",
    "minio: needs the minio and mc binaries (skipped without them)",
    "network: needs internet access (opt in with CELLMAP_FLOW_NETWORK_TESTS=1)",
    "slow: takes more than a few seconds",
]


[project.scripts]
cellmap_flow = "cellmap_flow.cli.main:main"
# The commands before 0.3.0, each now a cellmap_flow subcommand. They say
# which, run it, and go in the release after 0.3.0 (cli/aliases.py).
cellmap_flow_yaml = "cellmap_flow.cli.aliases:yaml"
cellmap_flow_view = "cellmap_flow.cli.aliases:view"
cellmap_flow_blockwise = "cellmap_flow.cli.aliases:blockwise"
cellmap_flow_blockwise_multiple = "cellmap_flow.cli.aliases:blockwise_multiple"
cellmap_flow_app = "cellmap_flow.cli.aliases:app"
cellmap_flow_server = "cellmap_flow.cli.server_cli:main"

# A served model and its postprocessing steps, as chunkmirage ops
# (serving/chunkmirage_ops.py).
[project.entry-points."chunkmirage.ops"]
"cellmap_flow.inference" = "cellmap_flow.serving.chunkmirage_ops:InferenceOp"
"cellmap_flow.postprocess" = "cellmap_flow.serving.chunkmirage_ops:PostprocessOp"
"cellmap_flow.postprocess_on_device" = "cellmap_flow.serving.chunkmirage_ops:DevicePostprocessOp"
