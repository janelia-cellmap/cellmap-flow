name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "test" alone proves the core install works without peft; the finetune
        # leg runs the tests marked `finetune` too.
        extras: ["test", "test,finetune"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extras }}]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Test
        run: pytest -n auto -m "not gpu and not lsf and not minio and not network"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Syntax errors, undefined names and similar outright bugs only; style is
      # not enforced.
      - run: ruff check --select E9,F63,F7,F82 cellmap_flow tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The dashboard's scripts are ES modules, served as they are. Plain
      # `node --check file.js` passes a file with import/export in it even
      # when it has a syntax error, so each one goes in as a module on stdin.
      - name: Dashboard JavaScript syntax
        run: |
          status=0
          for f in $(find cellmap_flow/dashboard/static/js -name '*.js' | sort); do
            node --input-type=module --check < "$f" || { echo "::error file=$f::syntax error"; status=1; }
          done
          exit $status

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Wheel contains only the cellmap_flow package
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          top = {n.split("/")[0] for n in names}
          stray = {t for t in top if t != "cellmap_flow" and not t.endswith(".dist-info")}
          assert not stray, f"wheel installs stray top-level entries: {sorted(stray)}"
          assert "cellmap_flow/models/models.yaml" in names, "model catalog missing from wheel"
          print(wheel, "ok")
          EOF
      # The pages load their templates' scripts and styles from the package
      # as they are, so a file the package data misses breaks a page silently.
      - name: Wheel ships every dashboard template and static file
        run: |
          python - <<'EOF'
          import glob, os, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          files = [p for d in ("templates", "static")
                   for p in glob.glob(f"cellmap_flow/dashboard/{d}/**/*", recursive=True)
                   if os.path.isfile(p)]
          missing = sorted(p for p in files if p not in names)
          assert files and not missing, f"dashboard files missing from the wheel: {missing}"
          assert any(n.startswith("cellmap_flow/dashboard/static/js/lib/") for n in names), \
              "static/js/lib/*.js missing from the wheel"
          print(len(files), "dashboard files ok")
          EOF
      - name: Installed wheel imports
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl --extra-index-url https://download.pytorch.org/whl/cpu
          cd /tmp && /tmp/wheel-env/bin/python -c "import cellmap_flow; from cellmap_flow.globals import g; print(cellmap_flow.__version__, sorted(g.model_catalog))"

  deploy-manifest:
    name: pixi lockfile matches pixi.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fileglancer launches cellmap-flow with `pixi run` from the lockfile
      # (runnables.yaml), so a manifest change without a re-lock would break
      # the deployment at install time.
      - run: curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.80.0 bash
      - run: ~/.pixi/bin/pixi lock --check

  macos:
    name: macOS (Apple silicon), pixi environments
    # macos-latest is Apple silicon. Every other job runs on Linux and installs
    # with pip, so nothing ran on a Mac or in the pixi environments people
    # install there; each of these steps catches one way a Mac broke
    # (2026-10-14). Apple's GPU is not tested: these runners are virtual
    # machines without it, so the device choices are tested by faking it.
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      PIXI_CACHE_DIR: /Users/runner/.cache/pixi
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.80.0 bash
      - uses: actions/cache@v4
        with:
          path: /Users/runner/.cache/pixi
          key: pixi-macos-${{ hashFiles('pixi.lock') }}
          restore-keys: pixi-macos-
      - name: Install the test, cellpose4 and bioimageio environments
        run: |
          ~/.pixi/bin/pixi install --locked -e test
          ~/.pixi/bin/pixi install --locked -e cellpose4
          ~/.pixi/bin/pixi install --locked -e bioimageio
      # The finetune command runs for real (it called stdbuf, which macOS does
      # not have), training runs torch and numpy together, YAMLs load where
      # there is no bsub, the address check connects to this machine, and the
      # serving engine and Cellpose's masks run. Not the whole suite: in the
      # pixi environment some Cellpose tests fail on their order, on Linux too.
      - name: The Mac's own paths, in the test environment
        run: >
          ~/.pixi/bin/pixi run --frozen -e test python -m pytest -n auto
          -m "not gpu and not lsf and not minio and not network"
          tests/finetune tests/cli/test_yaml_cli.py tests/utils/test_config_yaml.py
          tests/utils/test_address.py tests/utils/test_device.py tests/utils/test_postprocessors.py
          tests/utils/test_chunkmirage_server.py tests/utils/test_smoke_scripts.py
      - name: One OpenMP runtime in the cellpose4 environment
        run: ~/.pixi/bin/pixi run --frozen -e cellpose4 python tests/smoke/one_openmp.py
      - name: A zoo model description loads in the bioimageio environment
        run: ~/.pixi/bin/pixi run --frozen -e bioimageio python tests/smoke/zoo_description.py

  web:
    name: browser mode (web/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The browser engine, cloned at the commit web/chunkmirage.lock pins;
      # the app imports its TypeScript source.
      - run: npm run fetch:chunkmirage
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      # The page is rendered from the dashboard's templates by Python, so the
      # build needs cellmap_flow importable: the same install as the pytest
      # jobs, a few minutes with the CPU torch wheel. After the quick checks,
      # so a type error is reported before the install is paid for; worth
      # paying, because the render and the Vite build are what the Pages
      # workflow runs on main, and a template change that breaks either would
      # otherwise show up only after merging.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Render the dashboard page and build the app
        run: npm run render && npm run build
        working-directory: web
        env:
          PYTHON: python
