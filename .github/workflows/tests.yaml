name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "test" alone proves the core install works without peft; the finetune
        # leg runs the tests marked `finetune` too.
        extras: ["test", "test,finetune"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extras }}]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Test
        run: pytest -m "not gpu and not lsf and not minio and not network"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Syntax errors, undefined names and similar outright bugs only; style is
      # not enforced.
      - run: ruff check --select E9,F63,F7,F82 cellmap_flow tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Wheel contains only the cellmap_flow package
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          top = {n.split("/")[0] for n in names}
          stray = {t for t in top if t != "cellmap_flow" and not t.endswith(".dist-info")}
          assert not stray, f"wheel installs stray top-level entries: {sorted(stray)}"
          assert "cellmap_flow/models/models.yaml" in names, "model catalog missing from wheel"
          print(wheel, "ok")
          EOF
      - name: Installed wheel imports
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl --extra-index-url https://download.pytorch.org/whl/cpu
          cd /tmp && /tmp/wheel-env/bin/python -c "import cellmap_flow; from cellmap_flow.globals import g; print(cellmap_flow.__version__, sorted(g.model_catalog))"
