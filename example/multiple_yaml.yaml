# Example YAML configuration file: config.yaml

# Required: path to the dataset
data_path: "/some/shared/path"

# Required: project/charge group identifier
charge_group: "my_project_name"

# Optional: queue name (defaults to the saved queue, else "gpu_h100", if omitted)
queue: "gpu_h100"

# List of models to run. Each entry must include a "type" field and the corresponding parameters.
# "scale" picks a level of a multiscale data_path (s0, s1, ...); it is ignored,
# with a warning, when data_path already points at a single array.
models:

  # 1. DaCapo model entry
  - type: "dacapo"
    run_name: "run_1"
    iteration: 60
    name: "dacapo_model_1"

  # 2. Another DaCapo model entry (iteration is required)
  - type: "dacapo"
    run_name: "run_2"
    iteration: 0
    name: "dacapo_model_2"

  # 3. CellMap model entry
  - type: "cellmap"
    config_folder: "/path/to/cellmap/configs/folder"
    name: "cellmap_model_1"
    scale: "s0"

  # 4. Script-based model entry
  - type: "script"
    script_path: "/path/to/custom_script.py"
    name: "script_model_1"
    scale: "s1"

  # 5. BioImage Model Zoo model entry: a zoo id, a URL, or the path of a
  # model's rdf.yaml or .zip (voxel_size: unless its description gives one)
  - type: "bioimage"
    model: "/path/to/bioimage/model/rdf.yaml"
    voxel_size: [8, 8, 8]
    name: "bioimage_model_1"


### blockwise
output_path: "/some/shared/path/output.zarr"
# optional output channel-if not set output all channels from model
# output_channels: [mito, ld]
task_name: "cellpose_task"
workers: 4
