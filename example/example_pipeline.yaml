# Example CellMapFlow Pipeline
# This demonstrates a typical normalization -> inference -> postprocessing workflow

input_normalizers:
  - name: MinMaxNormalizer
    params:
      min_value: 0.0
      max_value: 255.0

  - name: ZScoreNormalizer
    params:
      mean: 0.5
      std: 0.1

postprocessors:
  - name: DefaultPostprocessor
    params:
      clip_min: -1.0
      clip_max: 1.0
      bias: 1.0
      multiplier: 127.5

  # DefaultPostprocessor maps the model's [-1, 1] output to 0-255, so the
  # midpoint of that range, not 0.5, separates foreground from background.
  - name: ThresholdPostprocessor
    params:
      threshold: 127
