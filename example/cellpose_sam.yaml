# Cellpose-SAM on jrc_mus-salivary-1, served from the cellpose4 pixi
# environment (`env: cellpose4`): its server, and nothing else, runs there.
#   cellmap_flow yaml example/cellpose_sam.yaml
# The model script, its output modes and its licence (non-commercial):
# example/cellpose_sam_model.py.
data_path: "/nrs/cellmap/data/jrc_mus-salivary-1/jrc_mus-salivary-1.zarr/recon-1/em/fibsem-uint8"

charge_group: "cellmap"

queue: "gpu_h100"

models:
  cellpose_sam:
    type: "script"
    script_path: "example/cellpose_sam_model.py"
    # A pixi environment of cellmap-flow's pixi.toml, or the absolute path
    # of a conda environment or virtualenv that has cellmap-flow installed.
    env: "cellpose4"
    # 64 nm, the script's input voxel size.
    scale: "s3"

# With OUTPUT = "masks" in the script, make the per-chunk ids unique across
# chunks:
# json_data:
#   postprocess:
#     - name: MortonSegmentationRelabeling
