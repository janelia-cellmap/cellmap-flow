# A BioImage Model Zoo model on jrc_mus-salivary-1: "conscientious-dromedary",
# a 3D residual U-Net for mitochondria in EM (two channels: foreground and
# boundaries, after its own sigmoid). bioimageio.core downloads it from the
# zoo on first use and runs its own preprocessing, so the uint8 EM goes in as
# it is.
#   cellmap_flow yaml example/bioimage_em.yaml
# Its server runs in pixi.toml's `bioimageio` environment, the bioimage type's
# default; no `env:` is needed.
data_path: "/nrs/cellmap/data/jrc_mus-salivary-1/jrc_mus-salivary-1.zarr/recon-1/em/fibsem-uint8"

charge_group: "cellmap"

queue: "gpu_h100"

models:
  mito_bioimageio:
    type: "bioimage"
    # A zoo id (nickname), a DOI or URL, or the path of a model's rdf.yaml
    # or .zip.
    model: "conscientious-dromedary"
    # Its description gives no physical voxel size: this is the level read
    # (s1, 16 nm). It fixes its tile at 20 x 256 x 256 voxels.
    voxel_size: 16
    # Its description gives no halo either: cut 16 voxels off each side of
    # the tile's output in y and x, so chunks meet where it saw both sides
    # (without, 16% of the voxels along a seam were 0.1 or more off what the
    # model gives them mid-tile; with, 0.8%). Its z is 20 voxels, fixed.
    context: [0, 16, 16]
