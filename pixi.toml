# The environment cellmap-flow is deployed from. Fileglancer's runnables.yaml
# launches `pixi run cellmap_flow view` and `pixi run cellmap_flow yaml` from
# this checkout, and the dashboard then starts inference servers on the
# cluster with `pixi run cellmap_flow serve` (CELLMAP_FLOW_SERVER_COMMAND
# below). Python dependencies come from pyproject.toml through the editable
# install, PyTorch's CUDA libraries with them (its Linux wheels bring their
# own: no CUDA toolkit is installed, as nothing here compiles CUDA); this file
# adds what PyPI cannot provide: the MinIO server and client and the
# neuroglancer fork that annotation painting needs, and the compiler that
# fork is built with.
#
# Linux is what deploys (Fileglancer, the cluster); Apple-silicon Macs
# (osx-arm64) can install it too, to run the viewer and dashboard and serve
# models on the Mac itself (no bsub there: servers run locally, and models
# serve and finetune on Apple's GPU). CUDA is Linux-only.
[workspace]
name = "cellmap-flow"
version = "0.3.0"
description = "Realtime prediction using neuroglancer"
channels = ["nvidia", "conda-forge", "pytorch"]
platforms = ["linux-64", "osx-arm64"]
# pixi.lock is lockfile version 7, which pixi reads from 0.68.0 on. An older
# pixi (Homebrew's lagged at 0.61) did not stop there: it tried to re-solve
# the lockfile and crashed. With this it says to update instead.
requires-pixi = ">=0.68.0"

[activation.env]
# The neuroglancer fork's C++ extension declares `uint64_t` while including
# only <cstddef>/<memory>/<string>. GCC 13+ stopped pulling <cstdint> in
# transitively and this environment resolves GCC 15, so the build fails with
# "'uint64_t' has not been declared". Force the include instead of carrying a
# patched fork; harmless for every other compile.
CXXFLAGS = "-include cstdint"
# Inference servers are LSF jobs on other nodes, where this environment is
# not on PATH; jobs/launch.py reads this to start them from the lockfile's env.
CELLMAP_FLOW_SERVER_COMMAND = "pixi run cellmap_flow serve"

[dependencies]
python = ">=3.11,<4.0"
pip = "*"
numpy = "*"
pyyaml = "*"
scikit-image = "*"
flask = "*"
pydantic = "*"
s3fs = "*"
zarr = "==2.18.4"
numcodecs = "==0.15.0"

[target.osx-arm64.activation.env]
# Training and serving use Apple's GPU (MPS); an operation PyTorch has no
# MPS kernel for runs on the CPU instead of failing the run.
PYTORCH_ENABLE_MPS_FALLBACK = "1"

[target.osx-arm64.dependencies]
# OpenBLAS's pthreads build, as on Linux. conda-forge's Mac default is its
# OpenMP build, which loads llvm-openmp's libomp with numpy; PyTorch's PyPI
# wheel loads its own libomp, and with two in one process training aborted
# at once ("OMP: Error #15: Initializing libomp.dylib, but found
# libomp.dylib already initialized").
libopenblas = { version = "*", build = "pthreads*" }

[pypi-dependencies]
# finetune: peft and tensorboard; postprocess: edt; ai-annotate: google-genai,
# the Vertex AI client for AI-assisted annotation (docs/ai_annotate.md). The
# MinIO binaries the finetune extra also needs are conda packages, in the
# finetune feature.
cellmap-flow = { path = ".", editable = true, extras = ["finetune", "postprocess", "ai-annotate"] }

[feature.finetune.dependencies]
# MinIO no longer publishes prebuilt binaries; conda-forge builds them.
minio-server = "*"
minio-client = "*"

[feature.finetune.target.linux-64.dependencies]
# The neuroglancer fork below has no wheel: it is built at install, a C++
# extension among it, with the environment's compiler (CXXFLAGS above). That
# compiler used to arrive with the CUDA toolkit, which nothing else needed.
# On a Mac, Apple's command-line tools build it.
cxx-compiler = "*"

[feature.finetune.pypi-dependencies]
# The neuroglancer fork with the voxel-annotation tools: the Draw tab, its
# brush and flood fill (pre-bound to A and F), and the S3 writes that save
# the painting to MinIO. Upstream neuroglancer, which PyPI has, has none of
# them, and without this the dashboard's annotation layers cannot be painted.
# Here, not in pyproject: a direct reference there would make the PyPI
# release unuploadable. Pinned to a commit, the one the conda installs
# (docs/finetuning.md) have been painting with, so a push to the branch does
# not change what deploys.
neuroglancer = { git = "https://github.com/briossant/neuroglancer.git", rev = "fae54db8c667176a602a34f0d9d1028956009836" }

# Cellpose (Cellpose-SAM, Cellpose 4) lives in an environment of its own,
# solved separately, where the `cellpose` model type runs and finetunes by
# default (CellposeModelConfig.default_env); `env:` in a model's YAML entry
# picks another (docs: "Running a model in its own environment").
[feature.cellpose4.pypi-dependencies]
cellpose = ">=4"

# fly_organelles' StandardUnet, which FlyModelConfig builds to load a raw
# training checkpoint (and which unpickling an eager model.pt references).
# Its package __init__ imports the training code too (gunpowder, fibsem-tools,
# xarray), so it lives in an environment of its own; its pyproject declares
# those, funlib.learn.torch and corditea included (git dependencies).
[feature.fly.pypi-dependencies]
fly-organelles = { git = "https://github.com/mzouink/fly-organelles", rev = "ab89c10" }

[feature.fly.pypi-options.dependency-overrides]
# fly-organelles pins xarray==2023.12.0, but cellmap-flow's
# funlib.persistence 0.6.1 needs iohub, which needs xarray>=2024.1.1. The
# StandardUnet does not use xarray; only the training data code does.
xarray = ">=2024.1.1"
# corditea (a fly-organelles dependency) asks for lsd-lite over git+ssh, which
# needs a GitHub key: lock and install fail without one. The same commit (its
# fix/empty_labels branch) over https instead.
lsd-lite = { git = "https://github.com/neptunes5thmoon/lsd-lite.git", rev = "055892b81851fb78b4664144188c40f2d1f4ef05" }

# Does not import DaCapo yet: dacapo-ml 0.3.0 resolves, with fibsem-tools 7,
# which no longer has the fibsem_tools.metadata it imports. 0.3.5 pins
# fibsem-tools<=6.3, whose tifffile<2024 holds numpy below the 2.0 that
# funlib.persistence 0.6.1 needs; DaCapo's main branch wants funlib.persistence
# from a git branch (ome-ngff) that no longer exists. So DaCapoModelConfig has
# no default_env: a DaCapo model's entry names a conda environment that has it.
[feature.dacapo.pypi-dependencies]
dacapo-ml = "*"

# For the `bioimage` model type, which defaults to this environment. timm is
# what the zoo's BiaPy transformers ("good-microbe", a 2D UNETR) build their
# blocks from; their weights need it to load.
[feature.bioimageio.dependencies]
# bioimageio.core 0.11.0 pins bioimageio.spec 0.5.12.0, which passes pydantic
# an argument pydantic 2.14 refuses: every model description failed to load
# ("'index_key' is expected to be an integer or a string"). The Mac's solve
# had picked 2.14.1; Linux's 2.13.5 loads them.
pydantic = "<2.14"

[feature.bioimageio.pypi-dependencies]
bioimageio-core = { version = "==0.11.0", extras = ["onnx", "pytorch"] }
timm = ">=1.0"
# A zoo model's architecture file may import what its own conda environment
# would have given it. empanada's (stupendous-sheep, infer_2d.py) imports cv2,
# which its environment.yaml gets through empanada-dl; without it the model
# failed to start ("No module named 'cv2'"). The headless wheel: conda-forge's
# py-opencv brings ffmpeg, X11 and Wayland along, none of which a server
# needs. scikit-image and PyYAML, the other things it imports, are already in
# the default dependencies.
opencv-python-headless = ">=4.8"

# For the `onnx` model type, which defaults to this environment: the browser
# mode's ONNX exports, and the models finetuned in the browser, served with
# ONNX Runtime. On Linux onnxruntime-gpu, whose CUDA provider is built for
# CUDA 13 from 1.27 on, as the torch wheels are; it loads cuDNN and cuBLAS
# from the nvidia packages torch brings, which the
# server has loaded by then (configs/onnx.py, _session). PyPI's onnxruntime
# for Linux is CPU-only, and it is what bioimageio-core[onnx] pulls into the
# bioimageio environment, so an ONNX model would run on the CPU there. On the
# Mac, onnxruntime, on the CPU; not pinned as Linux's is, since its wheels
# from 1.24 on want macOS 14 and the lock solves for 13 (bioimageio's has
# 1.23.2).
[feature.onnx.target.linux-64.pypi-dependencies]
onnxruntime-gpu = ">=1.27"

[feature.onnx.target.osx-arm64.pypi-dependencies]
onnxruntime = ">=1.20"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"

[feature.dev.dependencies]
black = "*"
mypy = "*"
ruff = "*"
pre-commit = "*"

[feature.dev.pypi-dependencies]
pdbpp = "*"
rich = "*"

[feature.docs.pypi-dependencies]
sphinx-autodoc-typehints = "*"
sphinx-autoapi = "*"
sphinx-click = "*"
sphinx-rtd-theme = "*"
myst-parser = "*"

[environments]
# What Fileglancer deploys: dashboard, catalog models, finetuning. Cellpose
# runs in cellpose4.
default = { features = ["finetune"], solve-group = "default" }
test = { features = ["finetune", "test"], solve-group = "default" }
dev = { features = ["finetune", "test", "dev"], solve-group = "default" }
docs = { features = ["docs"] }
dacapo = { features = ["finetune", "dacapo"] }
bioimageio = { features = ["finetune", "bioimageio"] }
# The `onnx` model type's. Solved on its own, so that onnxruntime-gpu does not
# move the deployed environment's packages; not finetunable, so without the
# finetune feature's MinIO and neuroglancer fork, which only the dashboard uses.
onnx = { features = ["onnx"] }
# Cellpose's (the `cellpose` model type's default); its own solve group, so
# cellpose 4 can have the torch and numpy it needs without moving the
# default env's.
cellpose4 = { features = ["cellpose4"], solve-group = "cellpose4" }
# The `fly` model type defaults to it for raw checkpoints and eager model.pt
# files; TorchScript files run anywhere. Its own solve group: in the default
# one the overrides above do not apply (the group is solved as `default`), and
# moving them to the workspace re-solved the default env (torch 2.14.0 ->
# 2.14.1 among others).
fly = { features = ["finetune", "fly"], solve-group = "fly" }
