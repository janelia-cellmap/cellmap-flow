<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cellmap-flow (browser)</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #topbar {
        flex: 0 0 auto;
        padding: 0.5rem;
        display: flex;
        gap: 0.5rem;
        align-items: center;
        background: #1b1b1b;
        border-bottom: 1px solid #333;
        flex-wrap: wrap;
      }
      #topbar input[type="text"] {
        background: #222;
        color: #eee;
        border: 1px solid #333;
        padding: 0.3rem 0.5rem;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
      }
      #zarr-url { flex: 1; min-width: 18rem; }
      #onnx-url { width: 12rem; }
      #spec-url { width: 14rem; }
      #topbar button {
        background: #2a5;
        color: #fff;
        border: 0;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
        font-size: 0.85rem;
      }
      #topbar button:disabled {
        background: #444;
        cursor: not-allowed;
      }
      #status {
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        color: #8c8;
        white-space: pre-wrap;
        max-width: 40rem;
      }
      #viewer {
        flex: 1;
        min-width: 0;
        min-height: 0;
        background: #000;
      }
      #ng-host {
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="topbar">
      <input id="zarr-url" type="text" placeholder="zarr URL" value="https://uk1s3.embassy.ebi.ac.uk/idr/zarr/v0.4/idr0062A/6001240.zarr/0" />
      <input id="onnx-url" type="text" placeholder="ONNX URL" value="/demo-model.onnx" />
      <input id="spec-url" type="text" placeholder="spec JSON URL (blank = demo defaults)" value="/demo-model.json" />
      <button id="activate">Activate &amp; open in NG</button>
      <span id="status">idle. click Activate.</span>
    </div>
    <div id="viewer">
      <div id="ng-host"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
