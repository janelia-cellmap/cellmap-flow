<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cellmap-flow (browser)</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      body { display: flex; flex-direction: column; }
      #topbar {
        flex: 0 0 auto;
        padding: 0.5rem;
        display: flex;
        gap: 0.5rem;
        align-items: center;
        background: #1b1b1b;
        border-bottom: 1px solid #333;
        flex-wrap: wrap;
      }
      #topbar input[type="text"] {
        background: #222;
        color: #eee;
        border: 1px solid #333;
        padding: 0.3rem 0.5rem;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
      }
      #server-url { flex: 1; min-width: 18rem; }
      #dataset-path { width: 18rem; }
      #topbar button {
        background: #2a5;
        color: #fff;
        border: 0;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
        font-size: 0.85rem;
      }
      #status {
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        color: #8c8;
      }
      #viewer {
        flex: 1;
        min-width: 0;
        min-height: 0;
        background: #000;
      }
      #ng-host { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <div id="topbar">
      <input id="server-url" type="text" placeholder="cellmap-flow server URL (HF Space or Colab+ngrok)" value="https://your-name-cellmapflow.hf.space" />
      <input id="dataset-path" type="text" placeholder="dataset slug" value="dataset" />
      <button id="activate">Open in NG</button>
      <span id="status">idle. fill in the URL of a cellmap-flow inference server.</span>
    </div>
    <div id="viewer">
      <div id="ng-host"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
