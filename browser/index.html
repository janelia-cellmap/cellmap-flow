<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cellmap-flow (browser)</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      body { display: flex; flex-direction: column; }
      #topbar {
        flex: 0 0 auto;
        padding: 0.5rem;
        display: flex;
        gap: 0.5rem;
        align-items: center;
        background: #1b1b1b;
        border-bottom: 1px solid #333;
        flex-wrap: wrap;
      }
      #topbar input[type="text"] {
        background: #222;
        color: #eee;
        border: 1px solid #333;
        padding: 0.3rem 0.5rem;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
      }
      #server-url { flex: 1; min-width: 18rem; }
      #dataset-path { width: 18rem; }
      #topbar button {
        background: #2a5;
        color: #fff;
        border: 0;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
        font-size: 0.85rem;
      }
      #status {
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        color: #8c8;
      }
      #viewer {
        flex: 1;
        min-width: 0;
        min-height: 0;
        background: #000;
        position: relative;
      }
      #ng-host { width: 100%; height: 100%; position: relative; }

      /* In-browser BMZ inference panel */
      #bmz-panel {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 0;
        background: #0c0c0c;
        border-left: 1px solid #333;
        overflow: hidden;
        transition: width 0.2s ease;
        display: flex;
        flex-direction: column;
      }
      #bmz-panel.open { width: clamp(360px, 40vw, 640px); }
      #bmz-panel header {
        flex: 0 0 auto;
        padding: 0.5rem 0.75rem;
        font-size: 0.8rem;
        color: #aaa;
        border-bottom: 1px solid #333;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      #bmz-panel header strong { color: #eee; }
      #bmz-panel header .grow { flex: 1; }
      #bmz-status {
        font-family: ui-monospace, monospace;
        font-size: 0.7rem;
        color: #6a6;
      }
      #bmz-body {
        flex: 1;
        overflow: auto;
        padding: 0.75rem;
      }
      #bmz-canvases {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }
      #bmz-canvases > div {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.7rem;
        color: #aaa;
      }
      #bmz-canvases canvas {
        width: 100%;
        height: auto;
        image-rendering: pixelated;
        background: #000;
        border: 1px solid #333;
      }
      #bmz-meta {
        margin-top: 0.75rem;
        font-family: ui-monospace, monospace;
        font-size: 0.7rem;
        color: #888;
        white-space: pre-wrap;
      }
      #bmz-toggle {
        background: #355;
        color: #fff;
        border: 0;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
        font-size: 0.85rem;
      }
      .bmz-stream-row {
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px dashed #333;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .bmz-stream-row label {
        font-size: 0.7rem;
        color: #aaa;
      }
      .bmz-stream-row input[type="text"] {
        background: #222;
        color: #eee;
        border: 1px solid #333;
        padding: 0.3rem 0.5rem;
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
      }
      .bmz-stream-row .row {
        display: flex;
        gap: 0.4rem;
      }
      .bmz-stream-row .row input { flex: 1; }
      .bmz-stream-row button {
        background: #2a5;
        color: #fff;
        border: 0;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
        font-size: 0.8rem;
        white-space: nowrap;
      }
      #vz-status {
        font-family: ui-monospace, monospace;
        font-size: 0.7rem;
        color: #888;
        min-height: 1em;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div id="topbar">
      <input id="server-url" type="text" placeholder="cellmap-flow server URL (HF Space or Colab+ngrok)" value="https://your-name-cellmapflow.hf.space" />
      <input id="dataset-path" type="text" placeholder="dataset slug" value="dataset" />
      <button id="activate">Open in NG</button>
      <button id="bmz-toggle" title="Run a BioImage Model Zoo model in the browser (no server)">In-browser BMZ ▸</button>
      <span id="status">idle. fill in the URL of a cellmap-flow inference server.</span>
    </div>
    <div id="viewer">
      <div id="ng-host"></div>
      <aside id="bmz-panel" aria-hidden="true">
        <header>
          <strong>BMZ in-browser</strong>
          <select id="bmz-model">
            <option value="hiding-blowfish">hiding-blowfish (EnhancerMitochondriaEM2D)</option>
          </select>
          <button id="bmz-run" type="button">Run on test crop</button>
          <span class="grow"></span>
          <span id="bmz-status">idle</span>
        </header>
        <div id="bmz-body">
          <div id="bmz-canvases">
            <div><span>input</span><canvas id="bmz-input"></canvas></div>
            <div><span>output (foreground)</span><canvas id="bmz-output"></canvas></div>
          </div>
          <div id="bmz-meta"></div>
          <div class="bmz-stream-row">
            <label>Stream a real zarr through this model (sets up a service worker, opens Neuroglancer)</label>
            <div class="row">
              <input id="vz-src" type="text" placeholder="https://.../source.zarr or zarr://host/path" />
              <button id="vz-go" type="button">Stream</button>
            </div>
            <div id="vz-status"></div>
          </div>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
